<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Incidents')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
  <h1>Incidents</h1>

  <form method="get" th:action="@{/}" class="search">
    <input name="q" th:value="${query}" placeholder="Search location or description" aria-label="Search">
    <button type="submit">Search</button>
    <a th:if="${!#strings.isEmpty(query)}" th:href="@{/}">Clear</a>
  </form>

  <table th:if="${!#lists.isEmpty(incidents)}">
    <thead>
      <tr>
        <th>When</th>
        <th>Location</th>
        <th>Category</th>
        <th>Severity</th>
        <th>Reported by</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="incident : ${incidents}">
        <td><a th:href="@{/incidents/{id}(id=${incident.id})}"
               th:text="${#temporals.format(incident.occurredAt, 'dd/MM/yyyy HH:mm')}">01/01/2026 20:00</a></td>
        <td th:text="${incident.location}">Location</td>
        <td th:text="${incident.category}">Category</td>
        <td th:text="${incident.severity}">1</td>
        <td th:text="${incident.reporter}">name</td>
      </tr>
    </tbody>
  </table>

  <p th:if="${#lists.isEmpty(incidents) and !#strings.isEmpty(query)}">
    No incidents match "<span th:text="${query}">search</span>".
  </p>
  <p th:if="${#lists.isEmpty(incidents) and #strings.isEmpty(query)}">No incidents yet.</p>
</main>
</body>
</html>
