<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Error')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
  <h1 th:text="|Error ${status}|">Error</h1>
  <p th:text="${error}">Something went wrong.</p>
  <p><a th:href="@{/}">Back to incidents</a></p>
</main>
</body>
</html>
