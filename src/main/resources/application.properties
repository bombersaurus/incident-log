spring.application.name=incident-log

# The database is an H2 file in the data folder. Delete that folder to start again.
spring.datasource.url=jdbc:h2:file:./data/incidents
spring.datasource.username=sa
spring.datasource.password=

# Pick up template changes without restarting the app.
spring.thymeleaf.cache=false

# The browser only sends the login cookie on requests that start from this site.
server.servlet.session.cookie.same-site=lax

# Load made-up users and incidents when the database is empty.
app.seed=true
