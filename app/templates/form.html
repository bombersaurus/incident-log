{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<h1>{{ heading }}</h1>

{% for error in errors %}
<p class="error">{{ error }}</p>
{% endfor %}

<form method="post" class="stack">
  <label>When it happened
    <input type="datetime-local" name="occurred_at" value="{{ form.occurred_at }}" required>
  </label>
  <label>Location
    <input name="location" value="{{ form.location }}" required>
  </label>
  <label>Category
    <select name="category" required>
      {% for category in categories %}
      <option {% if form.category == category %}selected{% endif %}>{{ category }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Severity (1 is minor, 5 is serious)
    <select name="severity" required>
      {% for level in range(1, 6) %}
      <option {% if form.severity|string == level|string %}selected{% endif %}>{{ level }}</option>
      {% endfor %}
    </select>
  </label>
  <label>What happened
    <textarea name="description" rows="6" required>{{ form.description }}</textarea>
  </label>
  <label>Bodycam reference (optional)
    <input name="bodycam_ref" value="{{ form.bodycam_ref }}">
  </label>
  <button type="submit">Save</button>
</form>
{% endblock %}
